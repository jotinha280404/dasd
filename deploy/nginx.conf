server {
    listen 80;
    root /srv/repo;
    index index.html;

    # never serve secrets or repo internals
    location ~ /\. { deny all; }          # .env, .git, .claude, dotfiles
    location ~ \.env { deny all; }
    location /deploy/ { deny all; }

    # data files the dashboard polls — no caching so refreshes show new data
    location ~ \.(jsonl|json|csv)$ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
