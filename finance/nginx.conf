# Serves the built SPA and proxies /api to the finance-api container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://finance-api:8789;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 10m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
