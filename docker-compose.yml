# Homelab deployment: dashboard + EONET poller
#
#   docker compose up -d
#   → dashboard on http://<host>:8080  (pins / eonet / wiki tabs)
#   → poller accumulates eonet-tracker/data/observations.jsonl 24/7,
#     which is exactly what the latency study needs
#
# Optional: generate pins from inside the container (needs pin-factory/.env):
#   docker compose run --rm pins python -m src.generate --count 10

services:
  dashboard:
    image: nginx:alpine
    container_name: dasd-dashboard
    ports:
      - "8080:80"
    volumes:
      - ./:/srv/repo:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  eonet-poller:
    image: python:3.12-slim
    container_name: dasd-eonet-poller
    working_dir: /app/eonet-tracker
    volumes:
      - ./:/app
    command: >
      sh -c "pip install -q -r requirements.txt &&
             python -m src.fetch --watch 15"
    restart: unless-stopped

  # on-demand pin generation; not started by default
  pins:
    image: python:3.12-slim
    working_dir: /app/pin-factory
    volumes:
      - ./:/app
    profiles: ["tools"]
    entrypoint: ["sh", "-c", "pip install -q -r requirements.txt && exec \"$@\"", "--"]

  # ── Web apps (npm workspace) ────────────────────────────────────────
  # These are the framework-exception projects (React/Vite + Hono); see
  # CLAUDE.md and wiki/Web-Apps.md. Keys come from the root .env.

  # Orchestrator — visual agent-flow builder + live monitor
  orchestrator-api:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile.server
    container_name: dasd-orchestrator-api
    environment:
      - PORT=8787
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
    ports:
      - "8091:8787"
    restart: unless-stopped

  orchestrator-web:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile.web
    container_name: dasd-orchestrator-web
    ports:
      - "8081:80"
    depends_on:
      - orchestrator-api
    restart: unless-stopped

  # Higgsfield — generative-media studio
  higgsfield-api:
    build:
      context: .
      dockerfile: higgsfield/Dockerfile.server
    container_name: dasd-higgsfield-api
    environment:
      - PORT=8788
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FAL_KEY=${FAL_KEY:-}
    ports:
      - "8092:8788"
    restart: unless-stopped

  higgsfield-web:
    build:
      context: .
      dockerfile: higgsfield/Dockerfile.web
    container_name: dasd-higgsfield-web
    ports:
      - "8082:80"
    depends_on:
      - higgsfield-api
    restart: unless-stopped
