# Serves the built SPA and proxies /api to the calendar-api container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://calendar-api:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # chat replies can take a while (real LLM turn)
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
